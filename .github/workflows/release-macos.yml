name: Build SkyTrace V3.3.1 macOS

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64

    runs-on: ${{ matrix.runner }}
    env:
      SKYTRACE_COMMERCE_URL: ${{ vars.SKYTRACE_COMMERCE_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require public commerce URL for packaged builds
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SKYTRACE_COMMERCE_URL:-}" ]]; then
            echo "Repository variable SKYTRACE_COMMERCE_URL is required for packaged V3.3.1 builds."
            exit 1
          fi
          case "$SKYTRACE_COMMERCE_URL" in
            https://*) ;;
            *) echo "SKYTRACE_COMMERCE_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Verify and materialize V3.3.1 source
        run: bash scripts/materialize-v3.3.sh

      - name: Enforce commercial provider isolation
        run: node scripts/harden-commercial-build.mjs

      - name: Verify V3.3.1 release identity
        run: node scripts/verify-v3.3-release.mjs

      - name: Verify commerce backend and redeem codes
        run: npm --prefix commerce run check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download free commercial aviation reference data
        run: npm run data

      - name: Build macOS icon
        run: npm run icon:mac

      - name: Verify JavaScript
        run: npm run check

      - name: Re-verify release identity
        run: node scripts/verify-v3.3-release.mjs

      - name: Package SkyTrace.app
        run: npm run package -- --arch=${{ matrix.arch }}

      - name: Scan packaged app identity and runtime payload
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find out -maxdepth 3 -name 'SkyTrace.app' -type d -print -quit)"
          [[ -n "$APP" ]] || { echo "SkyTrace.app was not found."; exit 1; }

          PLIST="$APP/Contents/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          ASAR="$APP/Contents/Resources/app.asar"

          [[ "$VERSION" == "3.3.1" ]] || { echo "Unexpected packaged version: $VERSION"; exit 1; }
          [[ "$BUNDLE_ID" == "io.skytrace.desktop" ]] || { echo "Unexpected bundle ID: $BUNDLE_ID"; exit 1; }
          [[ -f "$ASAR" ]] || { echo "Packaged app.asar is missing."; exit 1; }
          [[ ! -d "$APP/Contents/Resources/app" ]] || { echo "Unexpected unpacked runtime app directory found."; exit 1; }

          grep -aF '3.3.1-performance-rc' "$ASAR" >/dev/null || { echo "V3.3.1 build marker is missing from app.asar."; exit 1; }
          grep -aF 'V3.3.1 RC' "$ASAR" >/dev/null || { echo "Visible V3.3.1 RC label is missing from app.asar."; exit 1; }
          grep -aF 'skytrace.performanceMode' "$ASAR" >/dev/null || { echo "Performance Mode marker is missing from app.asar."; exit 1; }
          grep -aF 'function flightsForMap()' "$ASAR" >/dev/null || { echo "Adaptive renderer is missing from app.asar."; exit 1; }
          grep -aF 'Have a SkyTrace code?' "$ASAR" >/dev/null || { echo "Redeem-code UI is missing from app.asar."; exit 1; }
          grep -aF '/api/account/redeem' "$ASAR" >/dev/null || { echo "Redeem-code account route is missing from app.asar."; exit 1; }

          if grep -aF 'V3.2 FREE' "$ASAR" >/dev/null; then
            echo "Stale V3.2 FREE UI label survived packaging."
            exit 1
          fi
          if grep -aF 'Installing SkyTrace v3.2.0 Free Stack' "$ASAR" >/dev/null; then
            echo "Old V3.2 installer content survived packaging."
            exit 1
          fi

          for host in opensky-network.org api.adsbdb.com api.open-meteo.com api.rainviewer.com; do
            if grep -aF "$host" "$ASAR" >/dev/null; then
              echo "Restricted provider host survived packaging: $host"
              exit 1
            fi
          done

          for marker in api.adsb.lol vrs-standing-data.adsb.lol api.met.no gibs.earthdata.nasa.gov 'Precipitation'; do
            grep -aF "$marker" "$ASAR" >/dev/null || { echo "Expected free commercial provider marker is missing: $marker"; exit 1; }
          done

          echo "Verified packaged SkyTrace $VERSION ($BUNDLE_ID), ASAR runtime, redeem codes, performance markers and free commercial provider stack."

      - name: Create release ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find out -maxdepth 3 -name 'SkyTrace.app' -type d -print -quit)"
          if [[ -z "$APP" ]]; then
            echo "SkyTrace.app was not found."
            find out -maxdepth 4 -print
            exit 1
          fi
          ZIP="SkyTrace-mac-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "${ZIP}.sha256"

      - name: Build DMG
        run: npm run make -- --arch=${{ matrix.arch }}

      - name: Collect DMG
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find out/make -name '*.dmg' -type f -print -quit || true)"
          if [[ -z "$DMG" ]]; then
            echo "SkyTrace DMG was not produced."
            find out/make -maxdepth 5 -print || true
            exit 1
          fi
          cp "$DMG" "SkyTrace-mac-${{ matrix.arch }}.dmg"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyTrace-mac-${{ matrix.arch }}
          path: |
            SkyTrace-mac-${{ matrix.arch }}.zip
            SkyTrace-mac-${{ matrix.arch }}.zip.sha256
            SkyTrace-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish V3.3.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v3.3.1"
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SkyTrace $TAG" \
              --notes "SkyTrace V3.3.1 for macOS adds V3.3 accounts/commerce, permanent redeem codes and a major performance pass. The public commercial runtime uses ADSB.lol for live traffic, Mictronics/VRS standing data for aircraft and route enrichment, MET Norway for general weather, NASA GPM IMERG via GIBS for the Precipitation map layer, AviationWeather.gov, OurAirports and OpenFreeMap. Restricted OpenSky REST, ADSBDB, Open-Meteo free-hosted and RainViewer endpoints are excluded and CI-scanned."
          fi
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

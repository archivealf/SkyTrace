name: Build SkyTrace V3.3.1 macOS

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64

    runs-on: ${{ matrix.runner }}
    env:
      SKYTRACE_COMMERCE_URL: ${{ vars.SKYTRACE_COMMERCE_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require public commerce URL for packaged builds
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SKYTRACE_COMMERCE_URL:-}" ]]; then
            echo "Repository variable SKYTRACE_COMMERCE_URL is required for packaged V3.3.1 builds."
            exit 1
          fi
          case "$SKYTRACE_COMMERCE_URL" in
            https://*) ;;
            *) echo "SKYTRACE_COMMERCE_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Verify and materialize V3.3.1 source
        run: bash scripts/materialize-v3.3.sh

      - name: Enforce commercial provider isolation
        run: node scripts/harden-commercial-build.mjs

      - name: Verify V3.3.1 release identity
        run: node scripts/verify-v3.3-release.mjs

      - name: Verify commerce backend
        run: node --check commerce/server.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download free aviation reference data
        run: npm run data

      - name: Build macOS icon
        run: npm run icon:mac

      - name: Verify JavaScript
        run: npm run check

      - name: Re-verify release identity
        run: node scripts/verify-v3.3-release.mjs

      - name: Package SkyTrace.app
        run: npm run package -- --arch=${{ matrix.arch }}

      - name: Verify packaged app version
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find out -maxdepth 3 -name 'SkyTrace.app' -type d -print -quit)"
          [[ -n "$APP" ]] || { echo "SkyTrace.app was not found."; exit 1; }
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          [[ "$VERSION" == "3.3.1" ]] || { echo "Unexpected packaged version: $VERSION"; exit 1; }
          echo "Verified packaged SkyTrace version $VERSION"

      - name: Create release ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find out -maxdepth 3 -name 'SkyTrace.app' -type d -print -quit)"
          if [[ -z "$APP" ]]; then
            echo "SkyTrace.app was not found."
            find out -maxdepth 4 -print
            exit 1
          fi
          ZIP="SkyTrace-mac-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "${ZIP}.sha256"

      - name: Build DMG
        run: npm run make -- --arch=${{ matrix.arch }}

      - name: Collect DMG
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find out/make -name '*.dmg' -type f -print -quit || true)"
          if [[ -z "$DMG" ]]; then
            echo "SkyTrace DMG was not produced."
            find out/make -maxdepth 5 -print || true
            exit 1
          fi
          cp "$DMG" "SkyTrace-mac-${{ matrix.arch }}.dmg"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyTrace-mac-${{ matrix.arch }}
          path: |
            SkyTrace-mac-${{ matrix.arch }}.zip
            SkyTrace-mac-${{ matrix.arch }}.zip.sha256
            SkyTrace-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish V3.3.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v3.3.1"
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SkyTrace $TAG" \
              --notes "SkyTrace V3.3.1 for macOS adds the V3.3 account/commerce features plus a major performance pass: adaptive aircraft rendering, Performance Mode, FPS/render telemetry, lighter glass effects, bounded trail memory and reduced unnecessary DOM/map work. Public builds connect to the configured SkyTrace Commerce HTTPS backend. ADSB.lol remains the primary live source; OpenSky REST, ADSBDB enrichment, the Open-Meteo free API and RainViewer remain disabled in commercial builds pending suitable licences/terms."
          fi
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

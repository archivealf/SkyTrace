name: Build SkyTrace V3.3 macOS

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64

    runs-on: ${{ matrix.runner }}
    env:
      SKYTRACE_COMMERCE_URL: ${{ vars.SKYTRACE_COMMERCE_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require public commerce URL for release builds
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SKYTRACE_COMMERCE_URL:-}" ]]; then
            echo "Repository variable SKYTRACE_COMMERCE_URL is required for public releases."
            exit 1
          fi
          case "$SKYTRACE_COMMERCE_URL" in
            https://*) ;;
            *) echo "SKYTRACE_COMMERCE_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Verify and materialize V3.3 source
        run: bash scripts/materialize-v3.3.sh

      - name: Verify commerce backend
        run: node --check commerce/server.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download free aviation reference data
        run: npm run data

      - name: Build macOS icon
        run: npm run icon:mac

      - name: Verify JavaScript
        run: npm run check

      - name: Package SkyTrace.app
        run: npm run package -- --arch=${{ matrix.arch }}

      - name: Create release ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find out -maxdepth 3 -name 'SkyTrace.app' -type d -print -quit)"
          if [[ -z "$APP" ]]; then
            echo "SkyTrace.app was not found."
            find out -maxdepth 4 -print
            exit 1
          fi
          ZIP="SkyTrace-mac-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "${ZIP}.sha256"

      - name: Build DMG
        continue-on-error: true
        run: npm run make -- --arch=${{ matrix.arch }}

      - name: Collect DMG
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find out/make -name '*.dmg' -type f -print -quit || true)"
          if [[ -n "$DMG" ]]; then
            cp "$DMG" "SkyTrace-mac-${{ matrix.arch }}.dmg"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyTrace-mac-${{ matrix.arch }}
          path: |
            SkyTrace-mac-${{ matrix.arch }}.zip
            SkyTrace-mac-${{ matrix.arch }}.zip.sha256
            SkyTrace-mac-${{ matrix.arch }}.dmg
          if-no-files-found: warn

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish V3.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v3.3.0"
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SkyTrace $TAG" \
              --notes "SkyTrace V3.3 for macOS adds username/password accounts, permanent Stripe-backed upgrades, smoother transitions, Liquid Glass-inspired controls, the refreshed rounded SkyTrace icon, and the existing free aviation data stack. Public release builds connect to the configured SkyTrace Commerce HTTPS backend."
          fi
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

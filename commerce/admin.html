<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyTrace Admin</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;background:#080b11;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#1c2638 0,#0a0d14 38%,#05070b 100%);padding:28px}.shell{max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.brand h1{font-size:28px;margin:3px 0}.eyebrow{font-size:11px;letter-spacing:.16em;color:#92a0b8}.card{border:1px solid #ffffff1c;background:#ffffff0a;box-shadow:0 20px 70px #0007;border-radius:22px;padding:18px;backdrop-filter:blur(18px)}.login{max-width:520px;margin:11vh auto}.login input,.field input,.field select{width:100%;border:1px solid #ffffff20;background:#060910;color:#fff;border-radius:12px;padding:11px 12px;outline:none}.login button,button{border:1px solid #ffffff24;background:#ffffff12;color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}.login button{width:100%;margin-top:10px}.muted{color:#929cad;line-height:1.45}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:10px;margin-bottom:14px}.stat strong{display:block;font-size:24px;margin-top:5px}.toolbar{display:grid;grid-template-columns:1.3fr .8fr .6fr .6fr 1fr auto;gap:8px;align-items:end;margin-bottom:14px}.field label{display:block;font-size:10px;letter-spacing:.08em;color:#929cad;margin:0 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}.table-wrap{overflow:auto;max-height:420px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #ffffff10;white-space:nowrap}th{position:sticky;top:0;background:#111722;color:#9ca8ba}.code-output{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;background:#05070c;border:1px solid #ffffff18;border-radius:12px;padding:12px;min-height:54px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-title h2{font-size:16px;margin:0}.actions{display:flex;gap:8px}.danger{border-color:#ff697755}.ok{color:#87e8b0}.bad{color:#ff8d98}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.wide{grid-column:auto}}@media(max-width:560px){body{padding:14px}.toolbar{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="login" class="card login">
  <div class="eyebrow">SKYTRACE CONTROL</div><h1>Admin dashboard</h1>
  <p class="muted">Enter the server-only admin token. It is kept in this browser tab only.</p>
  <input id="token" type="password" autocomplete="off" placeholder="Admin token">
  <button id="loginBtn">Unlock dashboard</button>
  <p id="loginMsg" class="muted"></p>
</div>
<main id="app" class="shell hidden">
  <div class="top"><div class="brand"><div class="eyebrow">SKYTRACE CONTROL</div><h1>Commerce & Cloud</h1></div><div class="actions"><button id="refreshBtn">Refresh</button><button id="lockBtn">Lock</button></div></div>
  <div id="stats" class="stats"></div>
  <section class="card wide">
    <div class="section-title"><h2>Generate redeem codes</h2><span id="codeStatus" class="muted"></span></div>
    <div class="toolbar">
      <div class="field"><label>PRODUCT</label><select id="codeProduct"><option value="pro">SkyTrace Pro</option><option value="airport_intelligence">Airport Intelligence</option><option value="advanced_aircraft">Advanced Aircraft</option><option value="replay_plus">Replay+</option><option value="themes">Themes</option></select></div>
      <div class="field"><label>COUNT</label><input id="codeCount" type="number" min="1" max="100" value="1"></div>
      <div class="field"><label>USES EACH</label><input id="codeUses" type="number" min="1" max="10000" value="1"></div>
      <div class="field"><label>EXPIRES (DAYS)</label><input id="codeDays" type="number" min="0" max="3650" value="0"></div>
      <div class="field"><label>LABEL</label><input id="codeLabel" maxlength="80" placeholder="giveaway"></div>
      <button id="generateBtn">Generate</button>
    </div>
    <div id="codeOutput" class="code-output">Generated plaintext codes appear here once. Save them before leaving this page.</div>
  </section>
  <div class="grid" style="margin-top:14px">
    <section class="card"><div class="section-title"><h2>Users</h2></div><div class="table-wrap"><table id="usersTable"></table></div></section>
    <section class="card"><div class="section-title"><h2>Purchases</h2></div><div class="table-wrap"><table id="purchasesTable"></table></div></section>
    <section class="card wide"><div class="section-title"><h2>Codes</h2></div><div class="table-wrap"><table id="codesTable"></table></div></section>
    <section class="card wide"><div class="section-title"><h2>Manual entitlement</h2></div><div class="toolbar" style="grid-template-columns:1fr 1fr auto;margin:0"><div class="field"><label>USERNAME</label><input id="grantUser" placeholder="username"></div><div class="field"><label>PRODUCT</label><select id="grantProduct"><option value="pro">SkyTrace Pro</option><option value="airport_intelligence">Airport Intelligence</option><option value="advanced_aircraft">Advanced Aircraft</option><option value="replay_plus">Replay+</option><option value="themes">Themes</option></select></div><button id="grantBtn">Grant</button></div><p id="grantStatus" class="muted"></p></section>
  </div>
</main>
<script src="/admin-ui.js"></script>
</body>
</html>

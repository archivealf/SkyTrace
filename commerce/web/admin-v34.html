<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkyTrace V3.4 Admin</title><link rel="stylesheet" href="/app/web.css"><style>main{max-width:1050px;margin:auto}.section{border:1px solid #ffffff16;border-radius:16px;padding:14px;margin:12px 0;background:#ffffff06}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.admin-item{border:1px solid #ffffff12;border-radius:11px;padding:9px;font-size:11px}.admin-item small{display:block;color:#9aa3b3;margin-top:4px}.danger{border-color:#ef444466}.good{border-color:#22c55e66}</style></head><body style="padding:24px;overflow:auto"><main><small>SKYTRACE ADMIN · V3.4</small><h1>Accounts, operations & reliability</h1><section id="auth" class="section"><input id="token" type="password" placeholder="Admin token"><button id="go">Unlock</button><p id="msg"></p></section><section id="app" class="hidden"><div class="row"><button id="backup">Create SQLite backup</button><button id="codesCsv">Download code CSV</button><button id="refresh">Refresh</button><button id="mainAdmin">Main admin</button></div><div id="status" class="drawer"></div><section class="section"><h2>User search</h2><div class="row"><input id="userQ" placeholder="Username"><button id="userSearch">Search</button></div><div id="users" class="admin-grid"></div></section><section class="section"><h2>Expiring entitlement</h2><div class="row"><input id="grantUser" placeholder="Username"><select id="grantEnt"><option value="pro">Pro</option><option value="airport_intelligence">Airport Intelligence</option><option value="advanced_aircraft">Advanced Aircraft</option><option value="replay_plus">Replay+</option><option value="themes">Themes</option></select><input id="grantDays" type="number" min="0" max="3650" value="30" placeholder="Days"><input id="grantLabel" placeholder="Reason / label"><button id="grantBtn">Grant</button></div><p><small>Use 0 days for a non-expiring manual grant. Stripe purchases and permanent code unlocks remain separate.</small></p><div id="grants" class="admin-grid"></div></section><section class="section"><h2>Purchase audit</h2><div class="row"><input id="purchaseQ" placeholder="Username or product"><button id="purchaseSearch">Search</button></div><div id="purchases" class="admin-grid"></div></section><section class="section"><h2>Admin audit</h2><div id="audit"></div></section></section></main><script src="/admin/v34.js"></script></body></html>
